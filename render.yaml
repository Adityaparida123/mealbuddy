# Render Blueprint — Meal Buddy backend (Express + MongoDB Atlas)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys ONLY the Node/Express backend from backend/. TypeScript runs via tsx
# (no compile step; `npm run build` is a typecheck). The frontend is deployed
# separately on Vercel (see vercel.json, rootDirectory: frontend).
#
# Secrets (MONGODB_URI, JWT_SECRET, GEMINI_API_KEY...) are set in the Render
# dashboard as Environment Variables with `sync: false` here — NEVER commit
# real credentials.
services:
  - type: web
    name: mealbuddy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
        value: meal_buddy
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
        value: gemini
      # Comma-separated allowed origins for CORS -> your Vercel frontend URL.
      - key: CLIENT_ORIGIN
        sync: false