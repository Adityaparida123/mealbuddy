# Render Blueprint — Meal Buddy backend (Express + MongoDB Atlas)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys ONLY the Node/Express backend from backend/. The frontend is
# deployed separately on Vercel (Root Directory = frontend in Vercel project
# settings). Render must never run the root package.json "build" script.
#
# Root Directory = backend, so the build/start commands below run inside
# backend/ using backend/package.json (build = tsc typecheck, start = tsx).
#
# Secrets (MONGODB_URI, JWT_SECRET, GEMINI_API_KEY...) are set in the Render
# dashboard as Environment Variables with `sync: false` here — NEVER commit
# real credentials.
services:
  - type: web
    name: mealbuddy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
        value: meal_buddy
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        sync: false
        value: gemini
      - key: GEMINI_MODEL
        sync: false
      # Comma-separated allowed origins for CORS -> your Vercel frontend URL.
      - key: CLIENT_ORIGIN
        sync: false